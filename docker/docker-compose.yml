services:
  lock-manager-1:
    build:
      context: ..
      dockerfile: docker/dockerfile
    env_file:
      - ../.env
    environment:
      NODE_TYPE: lock_manager
      NODE_ID: lock1
      PORT: 8001
      HOST: 0.0.0.0
      REDIS_HOST: redis
      PEER_NODES: "lock2:lock-manager-2:8002,lock3:lock-manager-3:8003"
    ports:
      - "8001:8001"
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - app-network

  lock-manager-2:
    build:
      context: ..
      dockerfile: docker/dockerfile
    env_file:
      - ../.env
    environment:
      NODE_TYPE: lock_manager
      NODE_ID: lock2
      PORT: 8002
      HOST: 0.0.0.0
      REDIS_HOST: redis
      PEER_NODES: "lock1:lock-manager-1:8001,lock3:lock-manager-3:8003"
    ports:
      - "8002:8002"
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - app-network

  lock-manager-3:
    build:
      context: ..
      dockerfile: docker/dockerfile
    env_file:
      - ../.env
    environment:
      NODE_TYPE: lock_manager
      NODE_ID: lock3
      PORT: 8003
      HOST: 0.0.0.0
      REDIS_HOST: redis
      PEER_NODES: "lock1:lock-manager-1:8001,lock2:lock-manager-2:8002"
    ports:
      - "8003:8003"
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - app-network

  # Queue nodes
  queue-node-1:
    build:
      context: ..
      dockerfile: docker/dockerfile
    env_file:
      - ../.env
    environment:
      NODE_TYPE: queue
      NODE_ID: queue1
      PORT: 8011
      HOST: 0.0.0.0
      REDIS_HOST: redis
    ports:
      - "8011:8011"
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - app-network

  # Cache nodes
  cache-node-1:
    build:
      context: ..
      dockerfile: docker/dockerfile
    env_file:
      - ../.env
    environment:
      NODE_TYPE: cache
      NODE_ID: cache1
      PORT: 8021
      HOST: 0.0.0.0
      REDIS_HOST: redis
    ports:
      - "8021:8021"
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - app-network

  # Redis for shared state
  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge